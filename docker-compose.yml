services:
  postgres:
    image: postgres:16-alpine
    container_name: urlshortner-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER: ${DB_USER:-postgres}
      - POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      - POSTGRES_DB: ${DB_NAME:-urlshortner}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-urlshortner}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - urlshortner-net

  redis:
    image: redis:7-alpine
    container_name: urlshortner-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redispassword}", "--appendonly", "yes"]
    ports:
    - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - urlshortner-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  urlshortner-net:
    driver: bridge